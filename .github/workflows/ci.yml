name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências (lock file)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Formatação (black --check)
        run: black --check src/ tests/ scripts/

      - name: Lint (ruff check)
        run: ruff check src/ tests/ scripts/

      - name: Testes (pytest + gate de cobertura)
        run: pytest

  build-and-push:
    name: Build e push das imagens Docker (GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/medasist-api:latest
            ghcr.io/${{ github.repository }}/medasist-api:${{ github.sha }}

      - name: Build e push da imagem UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ui.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/medasist-ui:latest
            ghcr.io/${{ github.repository }}/medasist-ui:${{ github.sha }}
