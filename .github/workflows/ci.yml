name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências (lock file)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Formatação (black --check)
        run: black --check src/ tests/ scripts/

      - name: Lint (ruff check)
        run: ruff check src/ tests/ scripts/

      - name: Testes (pytest + gate de cobertura)
        run: pytest