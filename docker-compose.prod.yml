# Stack de produção para VPS — puxa as imagens publicadas no GHCR pelo CI e
# adiciona o serviço Ollama (LLM + embeddings OpenAI-compatíveis) no mesmo host.
# Uso: docker compose -f docker-compose.prod.yml up -d
#
# Variante CPU-only (custo): remove a reserva de GPU e força inferência via CPU
# com contexto reduzido para caber em VPS de 12-16 GB de RAM. Em produção com
# GPU, remova OLLAMA_GPU_LAYERS/OLLAMA_CONTEXT_LENGTH e devolva o bloco deploy.
# Pré-requisitos do host: Docker + Compose plugin. Modelos a baixar:
#   ollama pull qwen2.5:3b && ollama pull all-minilm
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_GPU_LAYERS=0
      - OLLAMA_CONTEXT_LENGTH=4096
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - medasist_net

  api:
    image: ghcr.io/andreson1010/medasist/medasist-api:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data/raw:/app/data/raw:ro
      - ./logs:/app/logs
    env_file: .env
    environment:
      - LM_STUDIO_BASE_URL=http://ollama:11434/v1
      - LM_STUDIO_LLM_MODEL=qwen2.5:3b
      - LM_STUDIO_EMBEDDING_MODEL=all-minilm
      - MONITORING_ENABLED=true
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - medasist_net

  ui:
    image: ghcr.io/andreson1010/medasist/medasist-ui:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medasist_net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medasist_net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - medasist_net

networks:
  medasist_net:
    driver: bridge

volumes:
  ollama_data:
  prometheus_data:
  grafana_data: